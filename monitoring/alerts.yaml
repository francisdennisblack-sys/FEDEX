groups:
- name: fedex.rules
  rules:
  - alert: HighBestRecomputeRate
    expr: increase(fedex_best_recomputes_total[5m]) > 10
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High best-post recompute rate"
      description: "More than 10 best-post recomputes in 5m. Possible data churn or hot-writes."

  - alert: HighHttpErrorRate
    expr: increase(http_requests_total{job="fedex",status!~"2.."}[5m]) > 50
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High HTTP error rate"
      description: "Non-2xx responses exceeded threshold in last 5m."
