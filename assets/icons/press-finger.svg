<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" aria-hidden="true" role="img">
  <title>Press logo hint</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- circular button -->
  <circle cx="32" cy="32" r="18" fill="url(#g)" stroke="#0f766e" stroke-width="1"/>
  <!-- subtle highlight -->
  <ellipse cx="28" cy="26" rx="6" ry="3" fill="rgba(255,255,255,0.25)" />

  <!-- finger (stylized) -->
  <g transform="translate(18,8)">
    <!-- fingertip -->
    <path d="M18 22c0 2.2-1.8 4-4 4s-4-1.8-4-4v-6c0-1.7 1.3-3 3-3 1 0 1.8.5 2.5 1.3.6.7 1.3 1.1 2.5 1.1 1.6 0 3 1.4 3 3v9z" fill="#fde68a" stroke="#eab308" stroke-width="0.5"/>
    <!-- finger base -->
    <path d="M6 30c0 2 1.8 4 4 4h6c2.2 0 4-1.8 4-4v-4c0-1.7-1.3-3-3-3h-8c-1.7 0-3 1.3-3 3v4z" fill="#fcd34d" stroke="#eab308" stroke-width="0.5"/>
    <!-- fingertip shadow to suggest press -->
    <ellipse cx="14" cy="24" rx="5.5" ry="2.2" fill="rgba(0,0,0,0.08)" />
  </g>

  <!-- small ripple under fingertip -->
  <g transform="translate(0,6)">
    <ellipse cx="32" cy="40" rx="9" ry="2.2" fill="rgba(255,255,255,0.06)" />
    <ellipse cx="32" cy="42" rx="12" ry="2.6" fill="rgba(0,0,0,0.04)" />
  </g>

</svg>
