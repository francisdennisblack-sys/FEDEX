name: Transcode demo WebM to MP4

on:
  workflow_dispatch: {}
  push:
    branches: [ 'demo-sim' ]

jobs:
  transcode:
    name: Transcode latest WebM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Find latest webm in recordings/
        run: |
          mkdir -p out
          FILE=$(ls -t recordings/*.webm 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then echo "No webm found in recordings/" && exit 1; fi
          echo "Found: $FILE"
          echo "$FILE" > latest_webm.txt

      - name: Transcode to MP4 (H.264)
        run: |
          FILE=$(cat latest_webm.txt)
          BASENAME=$(basename "$FILE" .webm)
          OUT="out/${BASENAME}.mp4"
          ffmpeg -y -i "$FILE" -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "$OUT"
          echo "Wrote $OUT"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-mp4
          path: out/*.mp4
